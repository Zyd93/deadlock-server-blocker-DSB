name: CI & Release Builds

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests, syntax, and shell checks
        run: |
          python3 -m py_compile dsb/*.py
          python3 -m unittest discover -s tests -v
          bash -n scripts/dsb-gui scripts/dsb-askpass install.sh uninstall.sh

      - name: Package Linux release archive
        run: |
          tar -czf DeadlockServerBlocker-DSB-linux.tar.gz \
            dsb ui assets scripts install.sh uninstall.sh README.md LICENSE SECURITY.md

      - name: Upload Linux archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadlockServerBlocker-DSB-linux
          path: DeadlockServerBlocker-DSB-linux.tar.gz

      - name: Attach Linux archive to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" DeadlockServerBlocker-DSB-linux.tar.gz --clobber

  windows-test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Windows dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build DeadlockServerBlocker-DSB.exe
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --noconsole `
            --uac-admin `
            --paths "." `
            --icon "assets/icon.ico" `
            --name "DeadlockServerBlocker-DSB" `
            --add-data "ui;ui" `
            --add-data "assets;assets" `
            --collect-all webview `
            dsb/app.py

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadlockServerBlocker-DSB-win64
          path: dist/DeadlockServerBlocker-DSB.exe

      - name: Attach Windows executable to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/DeadlockServerBlocker-DSB.exe --clobber

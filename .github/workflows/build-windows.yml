name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Windows dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build DeadlockServerBlocker-DSB.exe
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --noconsole `
            --uac-admin `
            --icon "assets/icon.ico" `
            --name "DeadlockServerBlocker-DSB" `
            --add-data "ui;ui" `
            --add-data "assets;assets" `
            --collect-all webview `
            dsb/app.py

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadlockServerBlocker-DSB-win64
          path: dist/DeadlockServerBlocker-DSB.exe

      - name: Attach executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeadlockServerBlocker-DSB.exe
